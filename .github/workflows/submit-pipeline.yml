name: Submit Azure ML pipeline

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-az-ml
  WORKSPACE: mlw-az-ml

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.ARM_CLIENT_ID }}",
            "clientSecret":"${{ secrets.ARM_CLIENT_SECRET }}",
            "tenantId":"${{ secrets.ARM_TENANT_ID }}",
            "subscriptionId":"${{ secrets.ARM_SUBSCRIPTION_ID }}"}

      - name: Install Azure ML CLI extension
        run: az extension add --name ml --yes

      - name: Submit pipeline job
        run: |
          JOB_NAME=$(az ml job create \
            --file mlops/pipelines/pipeline.yml \
            --resource-group "$RESOURCE_GROUP" \
            --workspace-name "$WORKSPACE" \
            --query name --output tsv)
          echo "Submitted job: $JOB_NAME"
          echo "### Submitted Azure ML job \`$JOB_NAME\`" >> "$GITHUB_STEP_SUMMARY"
