$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
display_name: diabetes-pipeline
inputs:
  pipeline_job_input:
    type: uri_file
    path: azureml:diabetes-csv:1
outputs:
  pipeline_job_trained_model:
    type: mlflow_model
    name: diabetes-model
  pipeline_job_training_data:
    type: uri_folder
    mode: upload
  pipeline_job_validation_data:
    type: uri_folder
    mode: upload
settings:
  default_compute: azureml:cpu-training-cluster
  default_datastore: azureml:workspaceblobstore
jobs:
  preprocessing:
    type: command
    component: ./components/preprocessing.yml
    inputs:
      input_data: ${{parent.inputs.pipeline_job_input}}
    outputs:
      training_data: ${{parent.outputs.pipeline_job_training_data}}
      validation_data: ${{parent.outputs.pipeline_job_validation_data}}
  training:
    type: command
    component: ./components/training.yml
    inputs:
      training_data: ${{parent.jobs.preprocessing.outputs.training_data}}
      validation_data: ${{parent.jobs.preprocessing.outputs.validation_data}}
      n_estimators: 100
      max_depth: 3
      learning_rate: 0.3
    outputs:
      model_output: ${{parent.outputs.pipeline_job_trained_model}}
