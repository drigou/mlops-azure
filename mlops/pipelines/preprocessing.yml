$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: preprocessing
display_name: Preprocess data
description: Splits diabetes data into train/validation sets and scales the features.
version: 1
type: command
inputs:
  input_data:
    type: uri_file
  valid_size:
    type: number
    default: 0.3
    min: 0.01
    max: 0.99
  scaler:
    type: string
    default: standard
    enum: [standard, robust, minmax]
outputs:
  training_data:
    type: uri_folder
  validation_data:
    type: uri_folder
code: ./code
environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest
command: >-
  python preprocessing.py
  --input_data ${{inputs.input_data}}
  --valid_size ${{inputs.valid_size}}
  --scaler ${{inputs.scaler}}
  --training_data ${{outputs.training_data}}
  --validation_data ${{outputs.validation_data}}
